name: Mio CI & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test & Vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Unit tests
        run: go test ./... -count=1

      - name: Race tests
        run: go test -race ./... -count=1

      - name: Static analysis
        run: go vet ./...

  release:
    name: Build & Publish
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Cross-compile and package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist

          for target in \
            'linux amd64' \
            'linux arm64' \
            'darwin amd64' \
            'darwin arm64' \
            'windows amd64'; do
            read -r goos goarch <<< "$target"
            name="mio_${GITHUB_REF_NAME}_${goos}_${goarch}"
            stage="$(mktemp -d)"
            executable=mio
            if [[ "$goos" == windows ]]; then
              executable=mio.exe
            fi

            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 \
              go build -trimpath \
                -ldflags="-s -w -X main.version=${version}" \
                -o "$stage/$executable" ./cmd/mio

            # 确保发布版本号与 Git Tag 一致
            if [[ "$goos" == linux && "$goarch" == amd64 ]]; then
              actual="$("$stage/$executable" version)"
              if [[ "$actual" != "Mio ${version}" ]]; then
                echo "CLI version mismatch: got '$actual', want 'Mio ${version}'" >&2
                echo "请将 main.go 中的 version 从 const 改为 var，以支持 -ldflags -X。" >&2
                exit 1
              fi
            fi

            # 存在文档时才附带，避免依赖尚未创建的文件
            for doc in README.md LICENSE LICENSE.md; do
              if [[ -f "$doc" ]]; then
                cp "$doc" "$stage/"
              fi
            done

            if [[ "$goos" == windows ]]; then
              (cd "$stage" && zip -q -r "$GITHUB_WORKSPACE/dist/${name}.zip" .)
            else
              tar -czf "dist/${name}.tar.gz" -C "$stage" .
            fi
            rm -rf "$stage"
          done

          (cd dist && sha256sum ./*.tar.gz ./*.zip > SHA256SUMS.txt)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          flags=(--verify-tag --generate-notes)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            dist/*.tar.gz dist/*.zip dist/SHA256SUMS.txt \
            "${flags[@]}"
