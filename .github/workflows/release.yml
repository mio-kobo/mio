name: Pure Mio native candidate build

on:
  workflow_dispatch:
  push:
    tags: ['v2.0.0-dev']

permissions:
  contents: read

concurrency:
  group: native-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-candidate:
    name: Native source build, bootstrap, tests, package and install
    runs-on: [self-hosted, macOS, ARM64, mio-native]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # repository-approved v7.0.1
        with:
          persist-credentials: false
      - name: Run the Mio-native production pipeline
        shell: /bin/bash {0}
        env:
          PATH: ''
          MIO_BUNKO: ''
        run: >-
          /usr/bin/sandbox-exec
          -D "SEED=${MIO_NATIVE_SEED}"
          -D "SOURCE=${GITHUB_WORKSPACE}"
          -D "OUT=${RUNNER_TEMP}/mio-native-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          -f tools/native-ci/production.sb
          "${MIO_NATIVE_SEED}" run tools/native-ci
          --bunko-root "${GITHUB_WORKSPACE}/bunko" -- ci
          "${GITHUB_WORKSPACE}" "${MIO_NATIVE_SEED}"
          "${RUNNER_TEMP}/mio-native-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          "${GITHUB_SHA}"
