name: Package manager regression tests
on:
  workflow_dispatch:
    inputs:
      native_run:
        description: Successful distribution-pr run with unexpired artifacts (regression only)
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  lifecycle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: darwin-arm64, runner: macos-15}
          - {target: windows-amd64, runner: windows-2025}
          - {target: linux-amd64, runner: ubuntu-24.04}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - if: runner.os == 'Windows'
        name: Install current official WinGet client
        shell: pwsh
        run: |
          Install-Module Microsoft.WinGet.Client -Force -Repository PSGallery
          Repair-WinGetPackageManager -Force -Latest
          winget --version
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --yes --no-progress; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
      - run: python -m pip install PyYAML==6.0.3
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y apt-utils gnupg
      - name: Download selected verified native regression fixture (not release input)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
          NATIVE_RUN: ${{ inputs.native_run }}
        run: |
          set -euo pipefail
          [[ "$NATIVE_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/mio-kobo/mio/actions/runs/$NATIVE_RUN" > fixture-run.json
          python -c 'import json; r=json.load(open("fixture-run.json")); assert r["conclusion"]=="success" and r["path"]==".github/workflows/distribution-pr.yml"'
          ATTEMPT=$(python -c 'import json; print(json.load(open("fixture-run.json"))["run_attempt"])')
          mkdir -p build/fixture
          gh run download "$NATIVE_RUN" --repo mio-kobo/mio --name "mio-candidates-$TARGET-$NATIVE_RUN-$ATTEMPT" --dir build/fixture
          python scripts/distribution/verify.py --target "$TARGET" --output build/fixture
      - run: python scripts/package_managers/test_install.py --assets build/fixture --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manager-regression-${{ matrix.target }}
          path: |
            build/fixture/*.json
            build/fixture/*-installer.log
            fixture-run.json
