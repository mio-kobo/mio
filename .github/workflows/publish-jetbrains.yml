name: Publish JetBrains Marketplace

on:
  push:
    tags:
      - 'jetbrains-V*'

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'ExMikuPro/Mio' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/jetbrains-V')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify trusted Mio-2 history
        run: bash .github/scripts/check-release-history.sh
      - name: Test release guards
        run: python3 -B .github/scripts/test_plugin_release.py -v
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate tag and actual Gradle version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          bash editors/jetbrains/gradlew -p editors/jetbrains --no-daemon -q printReleaseVersion > "$RUNNER_TEMP/gradle-version.txt"
          version=$(sed -n 's/^MIO_RELEASE_VERSION=//p' "$RUNNER_TEMP/gradle-version.txt")
          python3 .github/scripts/plugin-release.py jetbrains "$RELEASE_TAG" --gradle-version "$version" --unpublished
      - name: Test, build and verify both IDEs
        working-directory: editors/jetbrains
        run: |
          xvfb-run -a bash ./gradlew --no-daemon --stacktrace \
            clean test buildPlugin verifyPluginStructure verifyPluginProjectConfiguration verifyPlugin
      - name: Validate ZIP and generate SHA256
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir release
          mapfile -t archives < <(find editors/jetbrains/build/distributions -maxdepth 1 -name '*.zip' -type f)
          test "${#archives[@]}" -eq 1
          cp "${archives[0]}" release/plugin.zip
          python3 .github/scripts/plugin-release.py jetbrains "$RELEASE_TAG" \
            --gradle-version "$RELEASE_VERSION" --archive release/plugin.zip --checksum
      - uses: actions/upload-artifact@v4
        with:
          name: jetbrains-${{ steps.version.outputs.version }}
          path: release/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jetbrains-release-diagnostics
          path: |
            editors/jetbrains/build/reports/**
            editors/jetbrains/build/test-results/**
          if-no-files-found: ignore

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: marketplace-jetbrains
    permissions:
      contents: read
    concurrency:
      group: marketplace-jetbrains-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Recheck trusted Mio-2 history after approval
        run: bash .github/scripts/check-release-history.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          name: jetbrains-${{ needs.build.outputs.version }}
          path: release
      - name: Recheck checksum, version and duplicate release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          (cd release && sha256sum --check plugin.zip.sha256)
          bash editors/jetbrains/gradlew -p editors/jetbrains --no-daemon -q printReleaseVersion > "$RUNNER_TEMP/gradle-version.txt"
          version=$(sed -n 's/^MIO_RELEASE_VERSION=//p' "$RUNNER_TEMP/gradle-version.txt")
          python3 .github/scripts/plugin-release.py jetbrains "$RELEASE_TAG" \
            --gradle-version "$version" --archive release/plugin.zip --unpublished
      - name: Publish verified ZIP to Stable
        working-directory: editors/jetbrains
        env:
          PUBLISH_TOKEN: ${{ secrets.JETBRAINS_PUBLISH_TOKEN }}
        run: |
          test -n "$PUBLISH_TOKEN"
          bash ./gradlew --no-daemon --stacktrace publishPlugin \
            -PreleaseArchive="$GITHUB_WORKSPACE/release/plugin.zip" -x buildPlugin -x signPlugin
