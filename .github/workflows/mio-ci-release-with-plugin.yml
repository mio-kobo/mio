name: Mio CI & Release

on:
  push:
    branches: [main, 'Mio-*']
    tags: ['v*']
  pull_request:
    branches: [main, 'Mio-*']
  schedule:
    - cron: '17 18 * * 6'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  test:
    name: Fast Test & Vet
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Fast tests
        run: go test -short ./... -count=1

      - name: Fast race tests
        run: go test -race -short ./... -count=1

      - name: Static analysis
        run: go vet ./...

  full:
    name: Full Regression
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Full regression (Bootstrap tested separately)
        shell: bash
        run: |
          set -euo pipefail
          go test -skip='^TestBootstrapSelfCompilation$' ./... -count=1 -timeout=35m

  safety:
    name: Stress & Full Race
    needs: full
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Stress tests (without Bootstrap duplication)
        shell: bash
        run: |
          set -euo pipefail
          MIO_STRESS_TEST=1 go test -skip='^TestBootstrapSelfCompilation$' ./... -count=1 -timeout=50m

      - name: Full race tests (without Bootstrap duplication)
        shell: bash
        run: |
          set -euo pipefail
          go test -race \
          -skip='^(TestBootstrapSelfCompilation|TestCodegenSelfAndBunkoSources)$' \
          ./... -count=1 -timeout=50m

  bootstrap:
    name: Bootstrap A-B-C-D
    needs: full
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run real four-generation Bootstrap
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ci-logs
          go test ./selfhost/bootstrap \
            -run '^TestBootstrapSelfCompilation$' \
            -count=1 -v -timeout=80m \
            2>&1 | tee build/ci-logs/bootstrap.log

      - name: Upload Bootstrap log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mio-bootstrap-log
          path: build/ci-logs/bootstrap.log
          if-no-files-found: warn
          retention-days: 30

  jetbrains-plugin:
    name: Test & Build JetBrains Plugin
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Ensure plugin sources and Gradle Wrapper are committed
        shell: bash
        run: |
          set -euo pipefail
          test -f editors/jetbrains/build.gradle.kts
          test -f editors/jetbrains/settings.gradle.kts
          test -f editors/jetbrains/gradlew
          test -f editors/jetbrains/gradle/wrapper/gradle-wrapper.jar
          test -f editors/jetbrains/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Test and package plugin
        working-directory: editors/jetbrains
        shell: bash
        run: bash ./gradlew --no-daemon test buildPlugin

      - name: Verify plugin compatibility
        working-directory: editors/jetbrains
        shell: bash
        run: bash ./gradlew --no-daemon verifyPlugin

      - name: Validate generated installable ZIP
        working-directory: editors/jetbrains
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(build/distributions/mio-language-support-*.zip)
          if (( ${#packages[@]} != 1 )); then
            echo "Expected exactly one Mio Language Support ZIP, found ${#packages[@]}" >&2
            exit 1
          fi
          unzip -tq "${packages[0]}" > /dev/null
          echo "Verified plugin package: ${packages[0]}"

      - name: Upload plugin ZIP as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: mio-language-support
          path: editors/jetbrains/build/distributions/mio-language-support-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Build & Publish
    needs: [test, full, safety, bootstrap, jetbrains-plugin]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Cross-compile and package complete SDK
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist

          for target in \
            'linux amd64' \
            'linux arm64' \
            'darwin amd64' \
            'darwin arm64' \
            'windows amd64'; do
            read -r goos goarch <<< "$target"
            name="mio_${GITHUB_REF_NAME}_${goos}_${goarch}"
            stage="$(mktemp -d)"
            executable=mio
            if [[ "$goos" == windows ]]; then
              executable=mio.exe
            fi

            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 \
              go build -trimpath \
                -ldflags="-s -w -X main.version=${version}" \
                -o "$stage/$executable" ./cmd/mio

            if [[ "$goos" == linux && "$goarch" == amd64 ]]; then
              actual="$("$stage/$executable" version)"
              if [[ "$actual" != "Mio ${version}" ]]; then
                echo "CLI version mismatch: got '$actual', want 'Mio ${version}'" >&2
                exit 1
              fi
            fi

            # Include Bunko so the SDK can compile programs importing kiso/*.
            cp -a bunko "$stage/bunko"
            for doc in README.md LICENSE LICENSE.md; do
              if [[ -f "$doc" ]]; then
                cp "$doc" "$stage/"
              fi
            done

            if [[ "$goos" == windows ]]; then
              (cd "$stage" && zip -q -r "$GITHUB_WORKSPACE/dist/${name}.zip" .)
            else
              tar -czf "dist/${name}.tar.gz" -C "$stage" .
            fi
            rm -rf "$stage"
          done

      - name: Download plugin ZIP built by this workflow
        uses: actions/download-artifact@v7
        with:
          name: mio-language-support
          path: dist

      - name: Validate release assets and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          plugins=(dist/mio-language-support-*.zip)
          if (( ${#plugins[@]} != 1 )); then
            echo "Expected one JetBrains plugin ZIP for release, found ${#plugins[@]}" >&2
            exit 1
          fi
          unzip -tq "${plugins[0]}" > /dev/null
          (cd dist && sha256sum ./*.tar.gz ./*.zip > SHA256SUMS.txt)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          flags=(--verify-tag --generate-notes)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            dist/*.tar.gz dist/*.zip dist/SHA256SUMS.txt \
            "${flags[@]}"
