name: Mio Core / Full PR candidates
permissions:
  contents: read
concurrency:
  group: distribution-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  MIO_DISTRIBUTION_STABLE_VERSION: ${{ inputs.stable_version || '' }}
  MIO_DISTRIBUTION_RC_VERSION: ${{ inputs.rc_version || '' }}
jobs:
  # One reviewed resolver owns tag parsing, version-to-branch mapping, exact
  # branch-tip verification, and bootstrap profile selection. Every later job
  # consumes its outputs instead of repeating release-specific assumptions.
  scope:
    runs-on: ubuntu-24.04
    outputs:
      wrapper_only: ${{ steps.scope.outputs.wrapper_only }}
      kind: ${{ steps.resolve.outputs.kind }}
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      branch: ${{ steps.resolve.outputs.branch }}
      seed_kind: ${{ steps.resolve.outputs.seed_kind }}
      seed_artifact: ${{ steps.resolve.outputs.seed_artifact }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - id: resolve
      name: Resolve the release version, archive branch and bootstrap profile
      env:
        STABLE: ${{ inputs.stable_version }}
        RC: ${{ inputs.rc_version }}
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p build/scope
        python - <<'PY' > build/scope/resolution.json
        import json, os, sys
        sys.path.insert(0, 'scripts/distribution')
        import bootstrap, versions
        stable = (os.environ.get('STABLE') or '').strip()
        rc = (os.environ.get('RC') or '').strip()
        if stable and rc:
            raise SystemExit('stable and RC versions are mutually exclusive')
        if stable:
            data = versions.verify_dispatch(stable, 'stable')
            profile = bootstrap.profile_for(stable)
            data.update(seed_kind=profile.kind, seed_artifact=profile.artifact)
        elif rc:
            data = versions.verify_dispatch(rc, 'rc')
        else:
            data = dict(kind='candidate', version='', tag='', branch='', seed_kind='', seed_artifact='')
        json.dump(data, sys.stdout)
        PY
        if [[ "${{ github.event_name }}" == workflow_dispatch && -n "${MIO_DISTRIBUTION_STABLE_VERSION}${MIO_DISTRIBUTION_RC_VERSION}" ]]; then
          TAG=$(python -c 'import json; print(json.load(open("build/scope/resolution.json"))["tag"])')
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
          python scripts/distribution/versions.py verify --tag "$TAG" --source-sha "$GITHUB_SHA" > build/scope/refs.json
        fi
        python - <<'PY' >> "$GITHUB_OUTPUT"
        import json, os
        data = json.load(open('build/scope/resolution.json'))
        for key in ('kind', 'version', 'tag', 'branch', 'seed_kind', 'seed_artifact'):
            print('%s=%s' % (key, data.get(key, '')))
        PY
    - id: scope
      name: Detect wrapper-only changes
      env:
        BASE: ${{ github.event.pull_request.base.sha }}
      shell: bash
      run: |
        python - <<'PYCODE'
        import os, subprocess, sys
        sys.path.insert(0, 'scripts/package_managers')
        from fixture import wrapper
        base = os.environ['BASE']
        paths = subprocess.check_output(['git', 'diff', '--name-only', base, 'HEAD'], text=True).splitlines() if base else []
        only = bool(paths) and all(wrapper(p) for p in paths)
        with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
            f.write('wrapper_only=' + str(only).lower() + '\n')
        PYCODE
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: release-scope-${{ github.run_id }}-${{ github.run_attempt }}
        path: build/scope/
        if-no-files-found: error
        retention-days: 7
  trusted-seed:
    name: Trusted ${{ needs.scope.outputs.seed_kind }} seed / Darwin ARM64 origin
    needs: scope
    if: github.repository == 'mio-kobo/mio' && github.event_name == 'workflow_dispatch' && needs.scope.outputs.kind == 'stable'
    runs-on: macos-15
    timeout-minutes: 180
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - name: Build from the reviewed pinned seed and verify the Darwin fixed point and cross outputs
      env:
        SSL_CERT_FILE: /etc/ssl/cert.pem
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ needs.scope.outputs.version }}
        SEED_KIND: ${{ needs.scope.outputs.seed_kind }}
      shell: bash
      run: |
        set -euo pipefail
        work=$(mktemp -d "$RUNNER_TEMP/mio-native.XXXXXXXX")
        echo "MIO_NATIVE_SEED_WORK=$work" >> "$GITHUB_ENV"
        python3 scripts/distribution/prepare.py --disposable-checkout "$work/source"
        python3 scripts/distribution/bootstrap.py --version "$VERSION"
        python3 "$work/source/scripts/ci/trusted_seed.py" --seed "$SEED_KIND" --output "$work/evidence"
    - uses: actions/upload-artifact@v4
      if: always() && env.MIO_NATIVE_SEED_WORK != ''
      with:
        name: ${{ needs.scope.outputs.seed_artifact }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          ${{ env.MIO_NATIVE_SEED_WORK }}/evidence/${{ needs.scope.outputs.seed_artifact }}-report.json
          ${{ env.MIO_NATIVE_SEED_WORK }}/evidence/logs/
        if-no-files-found: error
        retention-days: 14
    - name: Remove the private seed copy and working images
      if: always() && env.MIO_NATIVE_SEED_WORK != ''
      shell: bash
      run: rm -rf -- "$MIO_NATIVE_SEED_WORK"
  stable-web:
    needs: scope
    if: github.event_name == 'workflow_dispatch' && needs.scope.outputs.kind == 'stable'
    uses: ./.github/workflows/web.yml
  wrapper-regression:
    needs: [scope, packaging-tests]
    if: needs.scope.outputs.wrapper_only == 'true'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/package-manager-tests.yml
    with:
      targets: '[{"target":"windows-amd64","runner":"windows-2025"}]'
      chocolatey_only: true
  packaging-tests:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - run: python -m pip install PyYAML==6.0.3
    - run: python -m unittest discover -s scripts/distribution -p 'test_*.py' -v
    - run: python -m unittest discover -s scripts/package_managers -p 'test_*.py' -v
    - run: python -m unittest discover -s docker -p 'test_*.py' -v
  candidates:
    needs:
    - scope
    - follower
    - packaging-tests
    - trusted-seed
    if: >-
      !cancelled() && needs.follower.result == 'success' &&
      needs.packaging-tests.result == 'success' &&
      (needs.scope.outputs.kind == 'stable' && needs.trusted-seed.result == 'success' ||
       needs.scope.outputs.kind != 'stable' && needs.trusted-seed.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
        - target: darwin-arm64
          runner: macos-15
          compiler: mio-B
          core_compiler: mio-core-B
        - target: windows-amd64
          runner: windows-2025
          compiler: mio-B.exe
          core_compiler: mio-core-B.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - uses: actions/download-artifact@v4
      with:
        name: distribution-compiler-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: build/compiler
    - uses: actions/download-artifact@v4
      with:
        name: native-report-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: build/evidence
    - name: Prepare identical candidate inputs
      run: python scripts/distribution/prepare.py --disposable-checkout build/distribution-source
    - uses: actions/download-artifact@v4
      if: needs.scope.outputs.kind == 'stable'
      with:
        name: ${{ needs.scope.outputs.seed_artifact }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: build/trusted-seed
    - name: Package verified native B as Core and Full
      shell: bash
      run: >-
        python scripts/distribution/package.py --source build/distribution-source
        --compiler build/compiler/${{ matrix.compiler }} --core-compiler build/compiler/${{ matrix.core_compiler }}
        --report build/evidence/report.json --target ${{ matrix.target }} --output build/candidates
        ${{ needs.scope.outputs.kind == 'stable' && format('--seed {0} --seed-report build/trusted-seed/{1}-report.json', needs.scope.outputs.seed_kind, needs.scope.outputs.seed_artifact) || '' }}
    - name: Run relocated candidates outside the repository
      run: python scripts/distribution/verify.py --target ${{ matrix.target }} --output build/candidates
    - name: Install current official WinGet client
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        Install-Module Microsoft.WinGet.Client -Force -Repository PSGallery
        Repair-WinGetPackageManager -Force -Latest
        winget --version
        if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --yes --no-progress; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
    - name: Install package manager test dependencies
      shell: bash
      run: |
        python -m pip install PyYAML==6.0.3
        if [ "${{ runner.os }}" = Linux ]; then sudo apt-get update && sudo apt-get install -y apt-utils gnupg; fi
    - name: Build self-contained Windows installers from verified ZIPs
      if: runner.os == 'Windows'
      run: python scripts/package_managers/windows.py --assets build/candidates
    - name: Real package manager install, offline payload, upgrade and uninstall
      run: python scripts/package_managers/test_install.py --assets build/candidates --target ${{ matrix.target }}
    - name: Chocolatey install, offline tools, coexistence, upgrade and uninstall
      if: runner.os == 'Windows'
      run: python scripts/package_managers/test_chocolatey_install.py --assets build/candidates
    - uses: actions/upload-artifact@v4
      if: always() && runner.os == 'Windows'
      with:
        name: chocolatey-tests-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          build/candidates/chocolatey-test/*.nupkg
          build/candidates/chocolatey-verification.json
        if-no-files-found: error
    - uses: actions/upload-artifact@v4
      if: success()
      with:
        name: mio-candidates-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: 'build/candidates/*.tar.gz

          build/candidates/*.zip

          build/candidates/*-setup.exe

          build/candidates/SHA256SUMS

          build/candidates/verification.json

          build/candidates/native-report.json

          build/candidates/package-manager-verification.json

          '
        if-no-files-found: error
        retention-days: 14
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: distribution-diagnostics-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: 'build/candidates/*-installer.log

          build/candidates/*.json

          build/evidence/

          '
        if-no-files-found: warn
        retention-days: 14
  required:
    if: always()
    needs:
    - scope
    - packaging-tests
    - summary
    - candidates
    - docker-full-offline
    - candidate-linux
    - apt-distributions
    - wrapper-regression
    runs-on: ubuntu-24.04
    steps:
    - name: Require real native and candidate verification
      env:
        RESULTS: ${{ toJSON(needs) }}
      run: |
        python - <<'PY'
        import json, os
        results = json.loads(os.environ['RESULTS'])
        wrapper = results.pop('wrapper-regression')['result']
        assert results.pop('scope')['result'] == 'success'
        if wrapper != 'skipped':
            assert wrapper == 'success' and results.pop('packaging-tests')['result'] == 'success' and all(job['result'] == 'skipped' for job in results.values()), results
        else:
            assert all(job['result'] == 'success' for job in results.values()), results
        PY
  linux:
    needs: scope
    if: needs.scope.outputs.wrapper_only != 'true'
    name: Distribution native / linux-amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      darwin_arm64: ${{ steps.native.outputs.darwin_arm64 }}
      windows_amd64: ${{ steps.native.outputs.windows_amd64 }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: false
    - name: Build the reference VM host (go-hosted Stage A and VM oracle only)
      run: go build -o build/native/refvm ./tests/windows-amd64/refvm
    - name: Prepare source-free candidate build inputs
      run: python scripts/distribution/prepare.py --disposable-checkout build/distribution-source
    - id: native
      name: Stage A, native compiler and CLI fixed points, mio test, Runtime ABI contract, cross Stage A
      run: python build/distribution-source/scripts/ci/native_platforms.py linux --refvm build/native/refvm --output build/native/linux-amd64 ${{ needs.scope.outputs.kind == 'stable' && '--run-examples' || '' }}
    - uses: actions/upload-artifact@v4
      if: success()
      with:
        name: native-stage-a-${{ github.run_id }}-${{ github.run_attempt }}
        path: build/native/linux-amd64/stage-a/
        if-no-files-found: error
        retention-days: 7
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: native-report-linux-amd64-${{ github.run_id }}-${{ github.run_attempt }}
        path: 'build/native/linux-amd64/report.json

          build/native/linux-amd64/logs/

          build/native/linux-amd64/runtime-abi/results.json

          build/native/linux-amd64/runtime-abi/*.std*

          build/native/linux-amd64/native-differential/results.json

          build/native/linux-amd64/native-differential/*.std*

          build/native/linux-amd64/examples/

          '
        if-no-files-found: error
        retention-days: 7
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: native-compilers-linux-amd64-${{ github.run_id }}-${{ github.run_attempt }}
        path: 'build/native/linux-amd64/work/compiler-*

          build/native/linux-amd64/work/mio-*

          '
        if-no-files-found: warn
        retention-days: 7
    - uses: actions/upload-artifact@v4
      if: success()
      with:
        name: distribution-compiler-linux-amd64-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          build/native/linux-amd64/work/mio-B
          build/native/linux-amd64/work/mio-core-B
        if-no-files-found: error
        retention-days: 7
  follower:
    name: Distribution native / ${{ matrix.target }}
    needs: [scope, linux]
    strategy:
      fail-fast: false
      matrix:
        include:
        - target: darwin-arm64
          command: darwin
          runner: macos-15
          image: mio-darwin-arm64
          sha_output: darwin_arm64
        - target: windows-amd64
          command: windows
          runner: windows-2025
          image: mio-windows-amd64.exe
          sha_output: windows_amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - uses: actions/download-artifact@v4
      with:
        name: native-stage-a-${{ github.run_id }}-${{ github.run_attempt }}
        path: build/stage-a
    - name: Prepare source-free candidate build inputs
      run: python scripts/distribution/prepare.py --disposable-checkout build/distribution-source
    - name: Native B -> C -> D, mio test, Runtime ABI contract (no Go on this path)
      shell: bash
      env:
        EXPECTED_SHA256: ${{ needs.linux.outputs[matrix.sha_output] }}
      run: python build/distribution-source/scripts/ci/native_platforms.py ${{ matrix.command }} --stage-a "build/stage-a/${{ matrix.image }}" --expect-sha256 "$EXPECTED_SHA256" --output "build/native/${{ matrix.target }}" ${{ needs.scope.outputs.kind == 'stable' && '--run-examples' || '' }}
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: native-report-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: 'build/native/${{ matrix.target }}/report.json

          build/native/${{ matrix.target }}/logs/

          build/native/${{ matrix.target }}/runtime-abi/results.json

          build/native/${{ matrix.target }}/runtime-abi/*.std*

          build/native/${{ matrix.target }}/native-differential/results.json

          build/native/${{ matrix.target }}/native-differential/*.std*

          build/native/${{ matrix.target }}/examples/

          '
        if-no-files-found: error
        retention-days: 7
    - uses: actions/upload-artifact@v4
      if: success()
      with:
        name: distribution-compiler-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          build/native/${{ matrix.target }}/work/mio-B*
          build/native/${{ matrix.target }}/work/mio-core-B*
        if-no-files-found: error
        retention-days: 7
  summary:
    name: Distribution native / required
    if: always() && needs.scope.outputs.wrapper_only != 'true'
    needs:
    - scope
    - linux
    - follower
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - uses: actions/download-artifact@v4
      with:
        pattern: native-report-*-${{ github.run_id }}-${{ github.run_attempt }}
        path: build/native-reports
    - name: Combine the platform reports (fails unless every required check is PASS)
      run: python scripts/ci/native_platforms.py summary --reports build/native-reports --output build/native-summary ${{ needs.scope.outputs.kind == 'stable' && '--run-examples' || '' }}
    - name: Verify Bunko public-function coverage on all three release targets
      if: needs.scope.outputs.kind == 'stable'
      run: python scripts/ci/bunko_matrix.py --check --reports build/native-reports --output build/native-summary --require-pass
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: native-summary-${{ github.run_id }}-${{ github.run_attempt }}
        path: build/native-summary/
        if-no-files-found: error
        retention-days: 7
  docker-full-offline:
    needs:
    - scope
    - candidate-linux
    # The successful candidate may have an intentionally skipped seed ancestor.
    if: ${{ !cancelled() && needs.candidate-linux.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/download-artifact@v4
      with:
        name: mio-candidates-linux-amd64-${{ github.run_id }}-${{ github.run_attempt }}
        path: build/linux-candidates
    - name: Build Full image, test offline, save/load, test offline again
      env:
        STABLE_VERSION: ${{ needs.scope.outputs.kind == 'stable' && needs.scope.outputs.version || '' }}
      run: |
        args=()
        if [[ -n "$STABLE_VERSION" ]]; then args+=(--image "mio:$STABLE_VERSION-full"); fi
        python docker/build.py --candidates build/linux-candidates --output build/docker-candidate "${args[@]}"
    - uses: actions/upload-artifact@v4
      if: success()
      with:
        name: mio-docker-linux-amd64-candidate-${{ github.run_id }}-${{ github.run_attempt }}
        path: build/docker-candidate/
        if-no-files-found: error
        retention-days: 7
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: docker-offline-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
        path: build/docker-candidate/docker-verification.json
        if-no-files-found: warn
        retention-days: 14
  candidate-linux:
    needs:
    - scope
    - linux
    - packaging-tests
    - trusted-seed
    if: >-
      !cancelled() && needs.linux.result == 'success' &&
      needs.packaging-tests.result == 'success' &&
      (needs.scope.outputs.kind == 'stable' && needs.trusted-seed.result == 'success' ||
       needs.scope.outputs.kind != 'stable' && needs.trusted-seed.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - uses: actions/download-artifact@v4
      with:
        name: distribution-compiler-linux-amd64-${{ github.run_id }}-${{ github.run_attempt }}
        path: build/compiler
    - uses: actions/download-artifact@v4
      with:
        name: native-report-linux-amd64-${{ github.run_id }}-${{ github.run_attempt }}
        path: build/evidence
    - name: Prepare identical candidate inputs
      run: python scripts/distribution/prepare.py --disposable-checkout build/distribution-source
    - uses: actions/download-artifact@v4
      if: needs.scope.outputs.kind == 'stable'
      with:
        name: ${{ needs.scope.outputs.seed_artifact }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: build/trusted-seed
    - name: Package verified native B as Core and Full
      shell: bash
      run: >-
        python scripts/distribution/package.py --source build/distribution-source
        --compiler build/compiler/mio-B --core-compiler build/compiler/mio-core-B
        --report build/evidence/report.json --target linux-amd64 --output build/candidates
        ${{ needs.scope.outputs.kind == 'stable' && format('--seed {0} --seed-report build/trusted-seed/{1}-report.json', needs.scope.outputs.seed_kind, needs.scope.outputs.seed_artifact) || '' }}
    - name: Run relocated candidates outside the repository
      run: python scripts/distribution/verify.py --target linux-amd64 --output build/candidates
    - name: Install current official WinGet client
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        Install-Module Microsoft.WinGet.Client -Force -Repository PSGallery
        Repair-WinGetPackageManager -Force -Latest
        winget --version
        if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --yes --no-progress; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
    - name: Install package manager test dependencies
      shell: bash
      run: |
        python -m pip install PyYAML==6.0.3
        if [ "${{ runner.os }}" = Linux ]; then sudo apt-get update && sudo apt-get install -y apt-utils gnupg; fi
    - name: Build self-contained Windows installers from verified ZIPs
      if: runner.os == 'Windows'
      run: python scripts/package_managers/windows.py --assets build/candidates
    - name: Real package manager install, offline payload, upgrade and uninstall
      run: python scripts/package_managers/test_install.py --assets build/candidates --target linux-amd64
    - uses: actions/upload-artifact@v4
      if: success()
      with:
        name: mio-candidates-linux-amd64-${{ github.run_id }}-${{ github.run_attempt }}
        path: 'build/candidates/*.tar.gz

          build/candidates/*.zip

          build/candidates/*-setup.exe

          build/candidates/SHA256SUMS

          build/candidates/verification.json

          build/candidates/native-report.json

          build/candidates/package-manager-verification.json

          '
        if-no-files-found: error
        retention-days: 14
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: distribution-diagnostics-linux-amd64-${{ github.run_id }}-${{ github.run_attempt }}
        path: 'build/candidates/*-installer.log

          build/candidates/*.json

          build/evidence/

          '
        if-no-files-found: warn
        retention-days: 14

  apt-distributions:
    needs: candidate-linux
    # The successful candidate may have an intentionally skipped seed ancestor.
    if: ${{ !cancelled() && needs.candidate-linux.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:12', 'debian:13', 'ubuntu:22.04']
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/download-artifact@v4
      with:
        name: mio-candidates-linux-amd64-${{ github.run_id }}-${{ github.run_attempt }}
        path: build/linux-candidates
    - name: Signed APT lifecycle on clean Debian and Ubuntu containers
      env:
        IMAGE: ${{ matrix.image }}
      run: |
        docker run --rm --privileged -v "$PWD:/work" -w /work "$IMAGE" sh -ec '
          apt-get update
          apt-get install -y python3 python3-yaml sudo apt-utils gnupg util-linux
          python3 scripts/distribution/verify.py --target linux-amd64 --output build/linux-candidates
          python3 scripts/package_managers/test_install.py --assets build/linux-candidates --target linux-amd64
        '
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: apt-container-${{ strategy.job-index }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: build/linux-candidates/*verification.json

  stable-evidence:
    name: Assemble and attest stable release assets
    needs: [scope, required, trusted-seed, stable-web]
    if: >-
      !cancelled() && github.event_name == 'workflow_dispatch' && needs.scope.outputs.kind == 'stable' &&
      needs.required.result == 'success' && needs.trusted-seed.result == 'success' &&
      needs.stable-web.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/download-artifact@v4
      with:
        pattern: '@(mio-candidates-*|mio-docker-linux-amd64-candidate|trusted-*|chocolatey-tests|apt-container-*)-${{ github.run_id }}-${{ github.run_attempt }}'
        path: build/downloads
    - name: Bind checksums and evidence to the exact release inputs
      env:
        VERSION: ${{ needs.scope.outputs.version }}
      run: python scripts/distribution/stable_release.py --downloads build/downloads --output build/stable --version "$VERSION"
    - uses: actions/attest-build-provenance@v2
      id: attest
      with:
        subject-path: build/stable/release-verification.json
    - name: Retain and verify the signed evidence bundle
      env:
        BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        GH_TOKEN: ${{ github.token }}
      run: |
        cp "$BUNDLE_PATH" build/stable/release-verification.sigstore.json
        PYTHONPATH=scripts/distribution python -c 'import os; from pathlib import Path; from stable_release import authenticate; authenticate(Path("build/stable"), os.environ["GITHUB_REF_NAME"], os.environ["GITHUB_SHA"])'
    - uses: actions/upload-artifact@v4
      with:
        name: mio-stable-release-assets-${{ github.run_id }}-${{ github.run_attempt }}
        path: build/stable/
        if-no-files-found: error
        retention-days: 14

'on':
  workflow_dispatch:
    inputs:
      stable_version:
        description: Stable version without the v prefix; dispatch only on its existing tag in the matching version branch
        required: false
        type: string
      rc_version:
        description: Release candidate version (e.g. 2.1.2-rc.1); dispatch only on its existing v-prefixed tag
        required: false
        type: string
  pull_request:
    branches:
    - 'Mio-[0-9]*'
