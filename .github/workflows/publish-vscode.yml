name: Publish VS Code Marketplace

on:
  push:
    tags:
      - 'vscode-V*'

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'ExMikuPro/Mio' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/vscode-V')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify trusted Mio-2 history
        run: bash .github/scripts/check-release-history.sh
      - name: Test release guards
        run: python3 -B .github/scripts/test_plugin_release.py -v
      - name: Validate tag and package versions
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 .github/scripts/plugin-release.py vscode "$RELEASE_TAG" --unpublished
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install dependencies
        working-directory: editors/vscode
        run: npm ci
      - name: Compile
        working-directory: editors/vscode
        run: npm run compile
      - name: Lint
        working-directory: editors/vscode
        run: npm run lint
      - name: Real MioCore LSP and extension tests (no pending tests)
        working-directory: editors/vscode
        env:
          MIO_RELEASE_TESTS: '1'
        run: xvfb-run -a npm test
      - name: Package tested source
        working-directory: editors/vscode
        run: npm run package
      - name: Check VSIX content
        working-directory: editors/vscode
        run: npm run check
      - name: Validate final manifest and generate SHA256
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir release
          mapfile -t archives < <(find editors/vscode -maxdepth 1 -name '*.vsix' -type f)
          test "${#archives[@]}" -eq 1
          cp "${archives[0]}" release/plugin.vsix
          python3 .github/scripts/plugin-release.py vscode "$RELEASE_TAG" --archive release/plugin.vsix --checksum
      - uses: actions/upload-artifact@v4
        with:
          name: vscode-${{ steps.version.outputs.version }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: marketplace-vscode
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: marketplace-vscode-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Recheck trusted Mio-2 history after approval
        run: bash .github/scripts/check-release-history.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Install locked publishing tool only (no lifecycle scripts)
        working-directory: editors/vscode
        run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: vscode-${{ needs.build.outputs.version }}
          path: release
      - name: Recheck checksum, manifest and duplicate release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          (cd release && sha256sum --check plugin.vsix.sha256)
          python3 .github/scripts/plugin-release.py vscode "$RELEASE_TAG" --archive release/plugin.vsix --unpublished
      - name: Publish verified VSIX with OIDC (no PAT fallback)
        working-directory: editors/vscode
        run: npx --no-install vsce publish --oidc --packagePath "$GITHUB_WORKSPACE/release/plugin.vsix"
