name: VS Code Plugin CI

on:
  push:
    paths:
      - 'editors/vscode/**'
      - '.github/workflows/ci-vscode.yml'
  pull_request:
    paths:
      - 'editors/vscode/**'
      - '.github/workflows/ci-vscode.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vscode-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vscode:
    name: VS Code Extension
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install dependencies
        run: npm ci
      - name: Compile TypeScript
        run: npm run compile
      - name: ESLint
        run: npm run lint
      - name: Unit and VS Code integration tests
        run: xvfb-run -a npm test
      - name: Package VSIX
        run: npm run package
      - name: Verify VSIX content
        run: npm run check:vsix
      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: mio-vscode-vsix
          path: editors/vscode/*.vsix
          if-no-files-found: error
          retention-days: 7
