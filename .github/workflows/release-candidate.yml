name: Mio release preparation checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python3 -m pip install PyYAML==6.0.3
      - run: python3 -m unittest discover -s scripts/distribution -p 'test_*.py' -v
      - run: python3 -m unittest discover -s scripts/package_managers -p 'test_*.py' -v
      - run: python3 -m unittest discover -s docker -p 'test_*.py' -v
      - run: echo 'Native release candidates are built and validated by distribution-pr.yml on their exact RC tag. This workflow does not publish.'
