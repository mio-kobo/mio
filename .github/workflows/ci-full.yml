name: Mio CI V2 / Full
on:
  push:
    branches: [Mio-2.1]
  workflow_dispatch:
  schedule:
    - cron: '19 19 * * 0'
permissions:
  contents: read
concurrency:
  group: ci-full-${{ github.ref }}
  cancel-in-progress: false
  queue: max
jobs:
  policy:
    name: Full / trusted ref
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      linux_modules: ${{ steps.plan.outputs.linux_modules }}
      macos_modules: ${{ steps.plan.outputs.macos_modules }}
    env:
      # Native Verification stays deferred (NOT_RUN) unless the repository variable is exactly "enabled".
      MIO_NATIVE_VERIFICATION: ${{ vars.MIO_NATIVE_VERIFICATION }}
    steps:
      - name: Restrict manual native execution to Mio-2.1
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          if [ "$EVENT_NAME" != schedule ] && [ "$SOURCE_REF" != refs/heads/Mio-2.1 ]; then
            echo 'NOT_RUN: Full native validation requires Mio-2.1'
            exit 2
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'schedule' && 'Mio-2.1' || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - id: plan
        name: Select Full modules and record the Native Verification state
        run: |
          python scripts/ci/plan.py full --output build/ci-plan/full-plan.json
          python - <<'PY'
          import json, os
          plan = json.load(open("build/ci-plan/full-plan.json"))
          verification = plan["native_verification"]
          if verification["status"] == "NOT_RUN":
              print("::warning title=Native Verification NOT_RUN::" + verification["reason"])
          summary = os.environ["GITHUB_STEP_SUMMARY"]
          with open(summary, "a", encoding="utf-8") as stream:
              stream.write("### Full: Native Verification %s\n\n" % verification["status"])
              stream.write("Supplementary modules passing does not mean Mio native tests passed.\n\n")
              stream.write("Modules: %s\n" % ", ".join(verification["modules"]))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ci-plan/full-plan.json
          if-no-files-found: error
          retention-days: 7
  native:
    name: Full / native 3 platforms
    # Native darwin-arm64, linux-amd64 and windows-amd64 verification of the pure-Mio toolchain
    # (.github/workflows/native.yml). Separate from the reference and supplementary modules below; a required native
    # check that is not PASS fails the Full run.
    needs: policy
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/native.yml
    with:
      run_examples: true
  full:
    name: Full / ${{ matrix.target }}
    needs: policy
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: '["ubuntu-24.04"]'
          - target: macos-arm64
            runner: '["macos-15"]'
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 360
    env:
      MODULES: ${{ matrix.target == 'macos-arm64' && needs.policy.outputs.macos_modules || needs.policy.outputs.linux_modules }}
      MIO_CI_RESULTS: build/ci-results/run-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}
      MIO_CI_EVIDENCE_KEY: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'schedule' && 'Mio-2.1' || github.ref }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: bash scripts/ci/run.sh ${{ matrix.target }} "$MODULES" full
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.MIO_CI_RESULTS }}/
            build/m19ef-evidence/ci-abcd-${{ env.MIO_CI_EVIDENCE_KEY }}/
          if-no-files-found: error
          retention-days: 7
  bootstrap:
    name: Full / bootstrap / ${{ matrix.target }}
    # The Go bootstrap self-compilation (Compiler A -> B -> C -> D in the reference VM) takes about an hour per
    # platform. It runs in its own job so the other Full results are not delayed; it is part of Full and a failure
    # fails the workflow run and is never ignored. It does not belong to the Quick pull-request gate.
    needs: policy
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: '["ubuntu-24.04"]'
          - target: macos-arm64
            runner: '["macos-15"]'
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 210
    env:
      MIO_CI_RESULTS: build/ci-results/bootstrap-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'schedule' && 'Mio-2.1' || github.ref }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: bash scripts/ci/run.sh ${{ matrix.target }} go-bootstrap-reference full
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-bootstrap-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.MIO_CI_RESULTS }}/
          if-no-files-found: error
          retention-days: 7
