name: Native FFI shared fixtures
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: >-
    ${{ github.event_name == 'pull_request' && format('native-ffi-fixtures-pr-{0}', github.event.pull_request.number) || format('native-ffi-fixtures-dispatch-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  darwin-fixtures:
    name: Mach-O C fixtures (C host)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python native-tests/darwin.py --output build/native-ffi-darwin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ffi-darwin-fixtures
          path: |
            build/native-ffi-darwin/report.json
            build/native-ffi-darwin/*.log
            build/native-ffi-darwin/*.json
