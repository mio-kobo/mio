name: Mio Native / 6 platforms
# Native verification of the pure-Mio compiler, CLI and runtime on the three release targets.
# Version archive branches (Mio-2.1.1, Mio-2.2.0, Mio-3.0.0, ...) are validated by the same workflow.
# (scripts/ci/native_platforms.py). Engines are reported separately: Stage A of the Linux compiler is produced by the
# pure-Mio backend running in the Go reference VM ("go-hosted", never called a seed); every later stage and every test
# runs as a native image on the named runner. The trusted Native Seed (bootstrap-v2.1.0-seed.1) is not available to hosted runners and is
# always recorded NOT_RUN. A required check that is not PASS fails the run; nothing here ignores a failure.
on:
  workflow_dispatch:
    inputs:
      run_examples:
        description: Verify examples with the native CLI after the fixed point
        type: boolean
        default: false
  workflow_call:
    inputs:
      run_examples:
        description: Verify examples with the native CLI after the fixed point
        type: boolean
        default: false
      source_sha:
        description: Optional immutable commit SHA to check out and verify
        type: string
        default: ''
  pull_request:
    branches: ['Mio-[0-9]*', 'EXP/windows-amd64-c-ffi']
  push:
    branches: ['runtime-abi/**']
permissions:
  contents: read
concurrency:
  group: >-
    ${{ github.event_name == 'pull_request' && format('native-pr-{0}', github.event.pull_request.number) || format('native-{0}-{1}-{2}', github.event_name, github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  linux:
    name: Native / linux-amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      stage_a_ready: ${{ steps.native.outputs.stage_a_ready }}
      stage_a_artifact: ${{ format('native-stage-a-{0}-{1}', github.run_id, github.run_attempt) }}
      darwin_arm64: ${{ steps.native.outputs.darwin_arm64 }}
      windows_amd64: ${{ steps.native.outputs.windows_amd64 }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha || '' }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify source provenance
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: python scripts/ci/verify_source_provenance.py
      # Go is used only for the reference VM host that runs the Stage A lowering and the VM differential.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      # Development packages for tests/ffi/linux-amd64-dynamic: the zlib, SQLite3 and OpenSSL shared-library modules.
      # strace traces process execution for the `--linker native` check of tests/shared/linux-amd64.
      - name: Install the native module build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential zlib1g-dev libsqlite3-dev libssl-dev strace
      - name: Build the reference VM host (go-hosted Stage A and VM oracle only)
        run: go build -o build/native/refvm ./tests/windows-amd64/refvm
      - id: native
        name: Stage A, native compiler and CLI fixed points, mio test, Runtime ABI contract, cross Stage A
        run: >-
          python scripts/ci/native_platforms.py linux --refvm build/native/refvm --output build/native/linux-amd64
          ${{ inputs.run_examples && '--run-examples' || '' }}
      - name: Attest the cross-built Stage A images
        if: ${{ !cancelled() && steps.native.outputs.stage_a_ready == 'true' && github.event_name != 'pull_request' }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: build/native/linux-amd64/stage-a/mio-*
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.native.outputs.stage_a_ready == 'true' }}
        with:
          name: native-stage-a-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/native/linux-amd64/stage-a/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-report-linux-amd64-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/native/linux-amd64/report.json
            build/native/linux-amd64/logs/
            build/native/linux-amd64/runtime-abi/results.json
            build/native/linux-amd64/runtime-abi/*.std*
            build/native/linux-amd64/native-differential/results.json
            build/native/linux-amd64/native-differential/*.std*
            build/native/linux-amd64/examples/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-compilers-linux-amd64-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/native/linux-amd64/work/compiler-*
            build/native/linux-amd64/work/mio-*
          if-no-files-found: warn
          retention-days: 7
  follower:
    name: Native / ${{ matrix.target }}
    needs: linux
    # Both followers can still verify examples when only the Linux examples failed.
    if: ${{ !cancelled() && needs.linux.outputs.stage_a_ready == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            command: darwin
            runner: macos-15
            image: mio-darwin-arm64
            sha_output: darwin_arm64
          - target: windows-amd64
            command: windows
            runner: windows-2025
            image: mio-windows-amd64.exe
            sha_output: windows_amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha || '' }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify source provenance
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: python scripts/ci/verify_source_provenance.py
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.linux.outputs.stage_a_artifact }}
          path: build/stage-a
      - name: Native B -> C -> D, mio test, Runtime ABI contract (no Go on this path)
        shell: bash
        env:
          EXPECTED_SHA256: ${{ needs.linux.outputs[matrix.sha_output] }}
        run: >-
          python scripts/ci/native_platforms.py ${{ matrix.command }} --stage-a "build/stage-a/${{ matrix.image }}"
          --expect-sha256 "$EXPECTED_SHA256" --output "build/native/${{ matrix.target }}"
          ${{ inputs.run_examples && '--run-examples' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-report-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/native/${{ matrix.target }}/report.json
            build/native/${{ matrix.target }}/logs/
            build/native/${{ matrix.target }}/runtime-abi/results.json
            build/native/${{ matrix.target }}/runtime-abi/*.std*
            build/native/${{ matrix.target }}/native-differential/results.json
            build/native/${{ matrix.target }}/native-differential/*.std*
            build/native/${{ matrix.target }}/examples/
            build/native/${{ matrix.target }}/windows-dynamic-ffi/*.json
            build/native/${{ matrix.target }}/windows-dynamic-ffi/*.log
            build/native/${{ matrix.target }}/windows-dynamic-ffi/*.mio
          if-no-files-found: error
          retention-days: 7
  # The three additional targets live in their own reusable workflows (one native runner each) and are required here.
  linux-arm64:
    name: linux-arm64
    uses: ./.github/workflows/native-arm64.yml
    with:
      run_examples: ${{ inputs.run_examples || false }}
      source_sha: ${{ inputs.source_sha || '' }}
  darwin-amd64:
    name: darwin-amd64
    uses: ./.github/workflows/native-darwin-amd64.yml
    with:
      run_examples: ${{ inputs.run_examples || false }}
      source_sha: ${{ inputs.source_sha || '' }}
  windows-arm64:
    name: windows-arm64
    uses: ./.github/workflows/native-windows-arm64.yml
    with:
      run_examples: ${{ inputs.run_examples || false }}
      source_sha: ${{ inputs.source_sha || '' }}

  # Linux distribution and libc compatibility (tests/linux-compat): the CLI built by the linux-amd64 job runs inside
  # each distribution container on the x86-64 host (native execution, no emulation). Static and dynamic executables,
  # kiso/ffi/linux loading and native memory against the container's own libc, shared libraries loaded by a C host
  # built there, and binaries built on the host run in the container. Non-required until it has a CI history.
  linux-compat:
    name: Linux compatibility / ${{ matrix.image }}
    needs: linux
    if: ${{ !cancelled() && needs.linux.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:12', 'debian:13', 'ubuntu:22.04', 'ubuntu:24.04', 'alpine:3.20']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha || '' }}
          persist-credentials: false
      - name: Verify source provenance
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: python3 scripts/ci/verify_source_provenance.py
      - uses: actions/download-artifact@v4
        with:
          name: native-compilers-linux-amd64-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/compat-compilers
      - name: Build the cross-distribution binaries on the host (ubuntu-24.04)
        run: |
          set -o pipefail
          chmod +x build/compat-compilers/mio-B
          python3 tests/linux-compat/run.py --prebuild-only --mio build/compat-compilers/mio-B --output build/compat-prebuilt
      - name: Run the compatibility checks in ${{ matrix.image }}
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -o pipefail
          label=$(echo "$IMAGE" | tr ':/' '--')
          docker run --rm --platform linux/amd64 -v "$PWD:/w" -w /w "$IMAGE" sh -c \
            "sh tests/linux-compat/setup.sh && python3 tests/linux-compat/run.py --mio build/compat-compilers/mio-B --prebuilt build/compat-prebuilt --output build/compat/$label"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-compat-${{ strategy.job-index }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/compat/
          if-no-files-found: warn
          retention-days: 7

  summary:
    name: Native / required
    if: always()
    needs: [linux, follower, linux-arm64, darwin-amd64, windows-arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha || '' }}
          persist-credentials: false
      - name: Verify source provenance
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: python3 scripts/ci/verify_source_provenance.py
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: native-report-*-${{ github.run_id }}-*
          path: build/native-report-artifacts
      - name: Select the newest report for each platform across attempts
        run: >-
          python scripts/ci/native_platforms.py select-reports --reports build/native-report-artifacts
          --output build/native-reports --run-id "${{ github.run_id }}"
      - name: Combine the platform reports (fails unless every required check is PASS)
        env:
          NATIVE_LINUX_JOB_RESULT: ${{ needs.linux.result }}
          NATIVE_FOLLOWER_JOB_RESULT: ${{ needs.follower.result }}
          NATIVE_LINUX_ARM64_JOB_RESULT: ${{ needs.linux-arm64.result }}
          NATIVE_DARWIN_AMD64_JOB_RESULT: ${{ needs.darwin-amd64.result }}
          NATIVE_WINDOWS_ARM64_JOB_RESULT: ${{ needs.windows-arm64.result }}
        run: >-
          python scripts/ci/native_platforms.py summary --reports build/native-reports --output build/native-summary
          --targets linux-amd64,darwin-arm64,windows-amd64,linux-arm64,darwin-amd64,windows-arm64
          ${{ inputs.run_examples && '--run-examples' || '' }}
      # Per-function Bunko matrix from the same native reports: every covered library function must be PASS (or have a
      # recorded UNSUPPORTED reason) on every platform; UNVERIFIED, SKIP and NOT_RUN fail.
      - name: Bunko public-function test matrix
        if: always()
        run: python scripts/ci/bunko_matrix.py --check --reports build/native-reports --output build/native-summary --require-pass --platforms darwin-arm64,linux-amd64,windows-amd64,linux-arm64,darwin-amd64,windows-arm64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/native-summary/
          if-no-files-found: error
          retention-days: 7
