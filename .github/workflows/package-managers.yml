name: Package manager release proposals
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published stable tag
        required: true
        type: string
      submit_chocolatey:
        description: Submit to CCR after checking both exact versions in the signed-in moderation queue
        type: boolean
        default: false
      resubmit_chocolatey_v2_1_0:
        description: Authorize the mio and mio-core v2.1.0 moderation repair after checking both in CCR
        type: boolean
        default: false
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  # Dry runs must be able to verify a fix while a submission awaits review.
  group: package-managers-${{ github.event_name == 'workflow_dispatch' && !inputs.submit_chocolatey && 'dry-run-' || '' }}${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'mio-kobo/mio' && (github.event_name != 'release' || !github.event.release.prerelease)
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || 'Mio-2.1' }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - name: Validate tag and download existing Release (no publishing)
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          CCR_REPAIR: ${{ inputs.resubmit_chocolatey_v2_1_0 }}
          CCR_SUBMIT: ${{ inputs.submit_chocolatey }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CCR_REPAIR" == true && ( "$TAG" != v2.1.0 || "$CCR_SUBMIT" != true || "$GITHUB_REF" != refs/heads/Mio-2.1 ) ]]; then
            echo 'CCR repair requires v2.1.0 and submit_chocolatey on Mio-2.1' >&2
            exit 1
          fi
          python -c 'import sys; sys.path.insert(0,"scripts/package_managers"); from release import stable; import os; stable(os.environ["TAG"])'
          git merge-base --is-ancestor "refs/tags/$TAG" origin/Mio-2.1
          mkdir -p build/release-assets
          gh api "repos/mio-kobo/mio/releases/tags/$TAG" > build/release.json
          gh release download "$TAG" --repo mio-kobo/mio --dir build/release-assets
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Gate all six artifacts and generate real checksummed metadata
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev
          SOURCE_SHA=$(git rev-parse "refs/tags/$TAG^{commit}")
          python scripts/package_managers/release.py --tag "$TAG" --source-sha "$SOURCE_SHA" --release build/release.json --assets build/release-assets --output build/generated
          python scripts/package_managers/chocolatey.py --tag "$TAG" --source-sha "$SOURCE_SHA" --release build/release.json --assets build/release-assets --output build/generated/chocolatey
      - name: Check both Chocolatey outputs (no CCR access)
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: python scripts/package_managers/chocolatey_publish.py --packages build/generated/chocolatey --version "${TAG#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: package-manager-inputs
          path: build/
          if-no-files-found: error
  install:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: darwin-arm64, runner: macos-15}
          - {target: windows-amd64, runner: windows-2025}
          - {target: linux-amd64, runner: ubuntu-24.04}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || 'Mio-2.1' }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - if: runner.os == 'Windows'
        name: Install current official WinGet client
        shell: pwsh
        run: |
          Install-Module Microsoft.WinGet.Client -Force -Repository PSGallery
          Repair-WinGetPackageManager -Force -Latest
          winget --version
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --yes --no-progress; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
      - run: python -m pip install PyYAML==6.0.3
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y apt-utils gnupg
      - uses: actions/download-artifact@v4
        with:
          name: package-manager-inputs
          path: build
      - run: python scripts/package_managers/test_install.py --assets build/release-assets --target ${{ matrix.target }}
      - if: runner.os == 'Windows'
        name: Chocolatey lifecycle and exact stable nupkg from official URLs
        run: python scripts/package_managers/test_chocolatey_install.py --assets build/release-assets --stable-packages build/generated/chocolatey
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manager-results-${{ matrix.target }}
          path: |
            build/release-assets/package-manager-verification.json
            build/release-assets/chocolatey-verification.json
  propose:
    needs: [prepare, install]
    # Activation is an explicit maintainer action; manual dispatch is always dry.
    if: github.event_name == 'release' && vars.MIO_PACKAGE_PUBLISH_ENABLED == 'true'
    environment: package-managers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: Mio-2.1
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: package-manager-inputs
          path: build
      - name: Mint token limited to the two distribution repositories
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.MIO_DISTRIBUTION_APP_ID }}
          private-key: ${{ secrets.MIO_DISTRIBUTION_APP_PRIVATE_KEY }}
          owner: mio-kobo
          repositories: |
            homebrew-mio
            mio-apt
          permission-contents: write
          permission-pull-requests: write
      - run: sudo apt-get update && sudo apt-get install -y apt-utils gnupg
      - name: Sign APT snapshot and open review PRs (never merge)
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          GNUPGHOME: ${{ runner.temp }}/mio-signing
          MIO_APT_PRIVATE_KEY: ${{ secrets.MIO_APT_PRIVATE_KEY }}
          MIO_APT_SIGNING_FINGERPRINT: ${{ vars.MIO_APT_SIGNING_FINGERPRINT }}
        run: |
          set -euo pipefail
          mkdir -m 700 "$GNUPGHOME"
          trap 'rm -rf "$GNUPGHOME"' EXIT
          python -c 'import os,subprocess; subprocess.run(["gpg","--batch","--import"], input=os.environ["MIO_APT_PRIVATE_KEY"].encode(), check=True)'
          unset MIO_APT_PRIVATE_KEY
          python scripts/package_managers/propose.py --generated build/generated --assets build/release-assets --tag "$TAG"

  chocolatey-submit:
    needs: [prepare, install]
    # A new release or a rerun of a release event cannot upload to CCR.
    if: >-
      github.repository == 'mio-kobo/mio' &&
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/Mio-2.1' &&
      github.run_attempt == 1 && inputs.submit_chocolatey && vars.MIO_CHOCOLATEY_PUBLISH_ENABLED == 'true'
    environment: chocolatey-community
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: package-manager-inputs
          path: build
      - name: Submit to Chocolatey community moderation
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
          TAG: ${{ needs.prepare.outputs.tag }}
          CCR_REPAIR: ${{ inputs.resubmit_chocolatey_v2_1_0 }}
        shell: pwsh
        run: |
          $publishArgs = @('--packages', 'build/generated/chocolatey', '--version', $env:TAG.Substring(1), '--push', '--moderation-checked')
          if ($env:CCR_REPAIR -eq 'true') { $publishArgs += '--resubmit-v2-1-0' }
          python scripts/package_managers/chocolatey_publish.py @publishArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
