# Append to ~/.config/helix/languages.toml (or a project .helix/languages.toml).
# Use an absolute path for `command` to select a specific Mio binary.
[language-server.mio]
command = "mio"
args = ["lsp", "--stdio"]

[[language]]
name = "mio"
scope = "source.mio"
file-types = ["mio"]
comment-tokens = ["//"]
block-comment-tokens = [{ start = "/*", end = "*/" }]
roots = ["bunko", ".git"]
indent = { tab-width = 4, unit = "    " }
language-servers = ["mio"]
auto-format = false

# Tree-sitter highlighting requires a pinned rev of the grammar once it is merged
# and published; see README.md. Until then Helix uses LSP features only.
